# Alerta de Prometheus para el runbook db-pool-saturated.
# TODO(alumno): completar los TODO. La alerta debe disparar antes del 100%
# para dar margen de respuesta antes del impacto al usuario.

groups:
  - name: orders-db
    interval: 30s
    rules:

      - alert: DBConnectionPoolSaturated
        expr: |
          # TODO PromQL. Pista: db_pool_in_use / db_pool_size > 0.9
          # Si tu pool no está instrumentado, define qué métrica usarías
          # y déjalo documentado en observability/instrumentation.md
          TODO_PROMQL_AQUI
        for: 3m
        labels:
          severity: critical
          team: orders
          service: oms-orders-api
        annotations:
          summary: "Cloud SQL pool saturado en {{ $labels.instance }}"
          description: |
            Pool de conexiones al {{ $value | humanizePercentage }} durante >3 min
            en {{ $labels.instance }}. Si llega al 100%, las nuevas conexiones
            empezarán a fallar.
          runbook_url: "https://runbooks.example.com/db-pool-saturated?instance={{ $labels.instance }}&value={{ $value }}&service={{ $labels.service }}"
          dashboard_url: "https://grafana.example.com/d/oms-db-overview?var-instance={{ $labels.instance }}"

# ─── BONUS: alerta de "burn rate" sobre el SLO ───────────────────
# Si tu SLO de orders es "99,5% de POST /orders no-5xx en 28d", una
# alerta de burn rate dispara antes de que el SLO se viole de verdad.
