---
# Variables comunes a TODOS los entornos.
# Si una variable cambia entre staging y producción, va en su group_vars/<env>.yml.
# Si no cambia, va aquí.

project_prefix: "oms"
region:         "europe-west3"
image_repo:     "europe-west3-docker.pkg.dev/{{ gcp_project }}/oms/oms"

# El SHA de la imagen se pasa por -e en el comando, NO se hardcodea.
# Esto garantiza que el mismo SHA viaja a través de la promoción.
# image_sha: ← se pasa con -e image_sha=sha256:...

# Healthcheck endpoint
# NOTA: /health, NO /healthz — hallazgo real durante la Fase 2 (ver
# oms-platform/BITACORA-COMANDOS.md): Google Front End intercepta
# /healthz antes de llegar a Cloud Run en algunos productos serverless,
# devolviendo 404 genérico sin que la petición llegue al contenedor.
health_path: "/health"
container_port: 8080

# Cloud Run service name pattern
cloud_run_service: "{{ project_prefix }}-{{ env }}"

# Notificación a Slack (bonus, ver playbooks/deploy.yml post_tasks)
# Deliberadamente NO se define slack_webhook_url aquí: este proyecto no
# tiene un workspace real de Slack asociado (crear uno es un artefacto
# ajeno al alcance de infraestructura, ver Trabajo - enunciado.md sección 1).
# El playbook comprueba `slack_webhook_url is defined` y omite la
# notificación sin fallar si no se define. Para activarla de verdad, pasar
# -e slack_webhook_url=https://hooks.slack.com/services/... en la llamada
# a ansible-playbook (nunca hardcodearlo en el repo).
