---
# ── PRODUCTION ───────────────────────────────────────────
# La ÚNICA diferencia legítima respecto a staging.yml es esta lista.
# `diff group_vars/staging.yml group_vars/production.yml` debe ser corto
# y cada línea explicable en un PR.

env:         "production"
gcp_project: "acmeoms-production-fatm"

# Capacidad de Cloud Run (cpu/memory/min/max_instances): NO se declara aquí.
# HALLAZGO REAL (Fase 5, ver BITACORA-COMANDOS.md § 5.4/5.9/5.10): NFR-SCAL-001
# pedía pico 5× (25 instancias a 2000m), pero eso excede la cuota gratuita de
# CPU por región (CpuAllocPerProjectRegion=20000m), y además Cloud Run solo
# acepta CPU en {.08-1, 1.0, 2.0, 4.0, 6.0, 8.0} (1500m no es válido). Estos
# 4 valores vivían duplicados a mano aquí Y en terraform/envs/production.tfvars,
# sin nada que los mantuviera sincronizados. Ahora playbooks/deploy.yml los
# LEE directamente de `terraform output -json` en un pre_task — Terraform es
# la única fuente de verdad. Valor real aplicado: 15 instancias × 1000m CPU
# = 15000m (25% de margen bajo el límite). Para cambiar capacidad de
# producción, editar SOLO terraform/envs/production.tfvars + terraform apply.

# Endpoints
# Valores tomados de `terraform output` (módulo database) tras el apply
# real de la Fase 5 — ver oms-platform/BITACORA-COMANDOS.md.
db_instance_connection: "{{ gcp_project }}:{{ region }}:oms-production-postgres"
redis_endpoint:         "10.78.117.172"

# Tráfico — promoción gradual (no big-bang en producción)
# El playbook arranca con 10% y va subiendo si los SLOs aguantan.
traffic_percent: 10            # canary inicial; el playbook lo escalará

# Notificaciones
slack_channel: "#deploys-production"
pagerduty_routing_key: "TODO_PAGERDUTY_KEY"
